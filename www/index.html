<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>shadowbyte</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>shadowbyte</h1>
      <p>Hide and reveal messages inside images.</p>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="hide">Hide</button>
      <button class="tab" data-tab="reveal">Reveal</button>
    </div>

    <!-- HIDE PANEL -->
    <div class="panel" id="panel-hide">
      <div class="field">
        <label>Carrier image</label>
        <div class="dropzone" id="hide-dropzone">
          <span>Drop a PNG here or <label for="hide-img-input" class="browse-link">browse</label></span>
          <input type="file" id="hide-img-input" accept="image/png" hidden />
        </div>
        <div class="preview-wrap" id="hide-preview-wrap" hidden>
          <img id="hide-preview" alt="preview" />
          <button class="remove-btn" id="hide-remove">✕</button>
        </div>
      </div>

      <div class="field">
        <label>Mode</label>
        <div class="radio-group">
          <label><input type="radio" name="hide-mode" value="text" checked /> Text message</label>
          <label><input type="radio" name="hide-mode" value="file" /> File</label>
        </div>
      </div>

      <div class="field" id="hide-text-field">
        <label>Message</label>
        <textarea id="hide-message" rows="4" placeholder="Enter your secret message..."></textarea>
      </div>

      <div class="field" id="hide-file-field" hidden>
        <label>File to hide</label>
        <div class="dropzone small" id="hide-file-dropzone">
          <span>Drop a file here or <label for="hide-file-input" class="browse-link">browse</label></span>
          <input type="file" id="hide-file-input" hidden />
        </div>
        <div class="file-info" id="hide-file-info" hidden></div>
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" id="hide-password" placeholder="Enter password" />
      </div>

      <button class="btn-primary" id="hide-run">Hide</button>
      <div class="status" id="hide-status"></div>
    </div>

    <!-- REVEAL PANEL -->
    <div class="panel hidden" id="panel-reveal">
      <div class="field">
        <label>Stego image</label>
        <div class="dropzone" id="reveal-dropzone">
          <span>Drop a PNG here or <label for="reveal-img-input" class="browse-link">browse</label></span>
          <input type="file" id="reveal-img-input" accept="image/png" hidden />
        </div>
        <div class="preview-wrap" id="reveal-preview-wrap" hidden>
          <img id="reveal-preview" alt="preview" />
          <button class="remove-btn" id="reveal-remove">✕</button>
        </div>
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" id="reveal-password" placeholder="Enter password" />
      </div>

      <button class="btn-primary" id="reveal-run">Reveal</button>
      <div class="status" id="reveal-status"></div>

      <div class="result-box" id="reveal-result" hidden>
        <label>Extracted payload</label>
        <pre id="reveal-text-output"></pre>
        <a class="btn-secondary" id="reveal-file-download" hidden>Download file</a>
      </div>
    </div>
  </div>

  <canvas id="scratch-canvas" hidden></canvas>

  <script type="module" src="main.js"></script>
</body>
</html>
